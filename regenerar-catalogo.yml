name: Regenerar catálogo desde cero

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo-opds
  cancel-in-progress: false

jobs:
  regenerar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Guardar copia del catálogo anterior
        run: |
          mkdir -p /tmp/previo
          cp catalogo/catalogo.json /tmp/previo/catalogo.json 2>/dev/null || echo "[]" > /tmp/previo/catalogo.json

      - name: Borrar catálogo completo
        run: rm -rf catalogo

      - name: Generar catálogo desde cero
        env:
          OPDS_BASE: ${{ vars.OPDS_BASE }}
        run: python generador.py

      # Si el sitio falló a mitad, el catálogo nuevo saldría incompleto.
      # Se compara con el anterior y se cancela la subida si perdió demasiadas novelas.
      - name: Comprobar que no se pierden novelas
        run: |
          python - <<'PY'
          import json, sys
          previo = len(json.load(open("/tmp/previo/catalogo.json", encoding="utf-8")))
          nuevo = len(json.load(open("catalogo/catalogo.json", encoding="utf-8")))
          print(f"Novelas antes: {previo}, ahora: {nuevo}")
          if previo and nuevo < previo * 0.9:
              sys.exit("El catálogo nuevo tiene más de un 10% menos de novelas: no se guarda.")
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A catalogo
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
          else
            git commit -m "Regenerar catálogo OPDS desde cero"
            git push
          fi
