name: Desplegar OPDS Worker

on:
  workflow_dispatch:
  push:
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/desplegar-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar Worker
        run: npx wrangler@3 deploy
